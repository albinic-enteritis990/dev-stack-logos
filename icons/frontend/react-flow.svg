<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Rectangles -->
  <rect x="5" y="5" width="40" height="40" rx="8" stroke="white" stroke-width="6"/>
  <rect x="55" y="5" width="40" height="40" rx="8" stroke="#FF0055" stroke-width="6"/>
  <rect x="5" y="55" width="40" height="40" rx="8" stroke="white" stroke-width="6"/>
  <rect x="55" y="55" width="40" height="40" rx="8" stroke="white" stroke-width="6"/>
  
  <!-- Connecting Dots -->
  <circle cx="45" cy="25" r="5" fill="white"/>
  <circle cx="55" cy="25" r="5" fill="#FF0055"/>
  <circle cx="45" cy="75" r="5" fill="white"/>
  <circle cx="55" cy="75" r="5" fill="white"/>
</svg>
